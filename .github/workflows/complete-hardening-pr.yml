name: Complete hardening from PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-hardening-1.2
          fetch-depth: 0

      - name: Execute embedded hardening builder
        shell: bash
        run: |
          awk '
            /python3 <<'"'"'PY'"'"'/ { capture=1; next }
            capture && /^          PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/complete-hardening.yml > /tmp/complete-hardening.py
          test -s /tmp/complete-hardening.py
          python3 /tmp/complete-hardening.py

      - name: Commit completed hardening
        run: |
          rm -f .github/workflows/complete-hardening.yml .github/workflows/complete-hardening-pr.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Завершить Production Hardening 1.2.0"
          git push origin HEAD:agent/production-hardening-1.2
