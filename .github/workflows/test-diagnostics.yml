name: Test diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture tests
        shell: bash
        run: |
          set +e
          npm test > test-output.txt 2>&1
          echo "$?" > test-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-final
          path: |
            test-output.txt
            test-exit-code.txt
