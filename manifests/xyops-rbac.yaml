apiVersion: v1
kind: Namespace
metadata:
  name: xyops-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: xyops-kubernetes
  namespace: xyops-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: xyops-kubernetes-operator
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - pods/log
      - events
    verbs: [get, list]
  - apiGroups: [""]
    resources:
      - pods
    verbs: [delete]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/scale
      - replicasets
    verbs: [get, list, patch]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: [get, list]
  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: xyops-kubernetes-operator
subjects:
  - kind: ServiceAccount
    name: xyops-kubernetes
    namespace: xyops-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: xyops-kubernetes-operator
