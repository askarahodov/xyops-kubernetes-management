apiVersion: v1
kind: Namespace
metadata:
  name: xyops-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: xyops-kubernetes
  namespace: xyops-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: xyops-kubernetes-operator
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - pods/log
      - events
    verbs:
      - get
      - list
  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/scale
    verbs:
      - get
      - list
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: xyops-kubernetes-operator
subjects:
  - kind: ServiceAccount
    name: xyops-kubernetes
    namespace: xyops-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: xyops-kubernetes-operator
