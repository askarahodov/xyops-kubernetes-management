name: Bootstrap Kubernetes 1.1.0

on:
  push:
    branches:
      - main
    paths:
      - '.bootstrap/payload.part*'
      - '.github/workflows/bootstrap-kubernetes-1.1.0.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore project files
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/payload.part01
          cat .bootstrap/payload.part* | base64 -d > /tmp/kubernetes-1.1.0.tar.gz
          tar -tzf /tmp/kubernetes-1.1.0.tar.gz >/dev/null
          tar -xzf /tmp/kubernetes-1.1.0.tar.gz
          chmod +x index.js runner.js

      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run check
          npm pack --dry-run

      - name: Commit final project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Добавить Kubernetes Hygiene & Diagnostics workflows"
          git push origin HEAD:main
