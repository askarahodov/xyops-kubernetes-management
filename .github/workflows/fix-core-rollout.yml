name: Fix core rollout separation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-hardening-1.2
      - name: Keep rollout wait in hardening layer only
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('index.js')
          text = path.read_text(encoding='utf-8')
          old = "asBoolean(params.wait_for_rollout, true)"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected 2 core rollout defaults, found {count}')
          path.write_text(text.replace(old, "asBoolean(params.wait_for_rollout, false)"), encoding='utf-8')
          PY
          rm .github/workflows/fix-core-rollout.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Оставить ожидание rollout в hardening layer"
          git push origin HEAD:agent/production-hardening-1.2
