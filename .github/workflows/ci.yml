name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize-release:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/production-hardening-1.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize release files
        run: npm run release:normalize
      - name: Commit normalized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md xyops.json xyops-hygiene-plugin.json xyops-token-plugin.json
          if git diff --cached --quiet; then
            echo "Release files are already normalized"
          else
            git commit -m "Нормализовать release-файлы 1.2.0"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Verify normalization
        run: npm run release:check

  test:
    name: Node.js ${{ matrix.node-version }}
    needs: normalize-release
    if: always() && (needs.normalize-release.result == 'success' || needs.normalize-release.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 18
          - 20
          - 22

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check

      - name: Check release normalization
        run: npm run release:check

      - name: Verify package contents
        run: npm pack --dry-run
