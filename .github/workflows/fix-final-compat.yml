name: Fix final compatibility

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-hardening-1.2
      - name: Restore stable operation description
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('index.js')
          text = path.read_text(encoding='utf-8')
          old = "return { description: `Deployment ${namespace}/${name} restart ${rollout ? 'completed' : 'requested'}` };"
          new = "return { description: rollout ? `Restart completed for Deployment ${namespace}/${name}` : `Restart requested for Deployment ${namespace}/${name}` };"
          if old not in text:
              raise SystemExit('Restart description marker not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/test-diagnostics.yml .github/workflows/fix-final-compat.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Восстановить совместимость restart результата"
          git push origin HEAD:agent/production-hardening-1.2
