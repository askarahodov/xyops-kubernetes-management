name: Complete hardening from PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/production-hardening-1.2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute embedded hardening builder
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/complete-hardening.yml').read_text(encoding='utf-8')
          marker = "python3 <<'PY'\n"
          embedded = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          exec(compile(textwrap.dedent(embedded), 'complete-hardening.py', 'exec'))
          PY

      - name: Validate
        run: |
          npm test
          npm run check
          npm pack --dry-run

      - name: Commit completed hardening
        run: |
          rm -f .github/workflows/complete-hardening.yml .github/workflows/complete-hardening-pr.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Завершить Production Hardening 1.2.0"
          git push origin HEAD:agent/production-hardening-1.2
